[project]
name = "smartdine-backend"
version = "0.1.0"
description = "Restaurant operations and evidence-based intelligence backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "bcrypt>=4.0,<5",
  "pyjwt>=2.8,<3",
  "groq>=0.30,<2",
  "httpx>=0.28,<1",
  "pandas>=2.2,<3",
  "statsmodels>=0.14,<1",
  "numpy>=2,<3",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.1",
  "livekit-agents[cartesia,deepgram,elevenlabs,groq]==1.6.10",
  "livekit-api>=1.2,<2",
  "livekit-local-inference==0.2.6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["database: isolated PostgreSQL integration tests", "live: explicitly configured external service tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
