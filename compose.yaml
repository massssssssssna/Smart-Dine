services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: ./backend
    env_file: ./backend/.env
    command: ["uv", "run", "--no-sync", "python", "-m", "app.jobs.worker"]
    restart: unless-stopped
